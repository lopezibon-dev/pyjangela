# CI sinplea: mendekotasunak instalatu eta Django proiektua egiaztatu
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  egiaztatu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web   # manage.py eta requirements.txt hemen daude

    # .env ez dago Git-en: CIrako balioak (runner-eko MySQL-a, root/root)
    env:
      SECRET_KEY: ci-gako-faltsua
      DEBUG: "False"
      DB_HOST: localhost
      DB_PORT: "3306"
      DB_NAME: jangela
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"   # lokaleko bertsio bera (Django 6-k Python 3.12+ behar du)

      # Django 6-ren check-ak DBra konektatzen da (MySQL backend-aren egiaztapenak).
      # MySQL runner-ean instalatuta dago baina geldirik: abiarazi eta DB hutsa sortu.
      - name: MySQL abiarazi
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE jangela"

      - name: Mendekotasunak instalatu
        run: pip install -r requirements.txt

      - name: Django egiaztatu
        run: python manage.py check
