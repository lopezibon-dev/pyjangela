# Apache + mod_wsgi: Django aplikazioa eta fitxategi estatikoak
ServerName localhost

<VirtualHost *:80>
    # Django: mod_wsgi daemon prozesua, /opt/venv ingurunearekin
    WSGIDaemonProcess jangela python-home=/opt/venv python-path=/app
    WSGIProcessGroup jangela
    WSGIScriptAlias / /app/config/wsgi.py

    <Directory /app/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Estatikoak Apache-k zerbitzatzen ditu (collectstatic -> STATIC_ROOT)
    Alias /static/ /app/staticfiles/
    <Directory /app/staticfiles>
        Require all granted
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
